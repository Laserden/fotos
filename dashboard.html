<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page-container">
    <header style="display: flex; justify-content: space-between; align-items: center;"> <!-- Ensure header uses flex for button alignment -->
        <h1>Patient Dashboard</h1>
        <div> <!-- Wrapper for header buttons -->
            <button type="button" id="openChangePasswordModalButton" class="button-style secondary-button" style="margin-left: 10px;">Change Password</button>
            <button id="logoutButton" class="button-style" style="margin-left: 10px;">Logout</button> <!-- Added margin-left for spacing -->
        </div>
    </header>

    <section id="newPatientSection" class="dashboard-section">
        <h2>New Patient Card</h2>
        <form id="newPatientForm">
            <div>
                <label for="patientName">Patient Name:</label>
                <input type="text" id="patientName" required>
            </div>
            <div>
                <label for="patientNumber">Patient Number:</label>
                <input type="text" id="patientNumber" required>
            </div>
            <button type="submit" id="addPatientButton" class="button-style">Add Patient</button>
            <p id="patientFormMessage" class="message-area"></p>
        </form>
    </section>

    <div class="search-container">
        <input type="search" id="searchInput" placeholder="Search patients by name or number..." />
    </div>

    <section id="patientCardsSection" class="dashboard-section">
        <h2>Patient Cards</h2>
        <div id="patientCardsContainer">
            <!-- Patient cards will be dynamically inserted here -->
        </div>
    </section>
</div> <!-- .page-container closes -->

    <!--
    Patient Card Template Structure (for reference in JS):
    <div class="patient-card">
        <h3>Patient Name: [Name]</h3>
        <p>Patient Number: [Number]</p>
        <div class="image-upload-area">
            <p>Images:</p>
            <-- Images and upload form for this patient will go here -->
        </div>
    </div>
    -->

    <script src="js/main.js"></script>
    <script src="js/dashboard.js"></script>

    <!-- Image Viewer Modal -->
    <div id="imageViewerModal" class="modal">
        <div class="modal-content">
            <span id="closeModalButton" class="close-button">&times;</span>
            <div class="image-display-area">
                <img id="fullImageView" src="" alt="Full Size View" />
                <div class="image-overlay-bar">
                    <div id="imageInfo" class="image-info-display-overlay">
                        <p>Name: <span id="imageNameInfo"></span></p>
                        <p>Date: <span id="imageDateInfo"></span></p>
                    </div>
                    <div class="modal-controls-overlay">
                        <button id="prevImageButton" class="button-style">&laquo; Prev</button>
                        <button id="nextImageButton" class="button-style">Next &raquo;</button>
                        <button id="zoomInButton" class="button-style">Zoom In (+)</button>
                        <button id="zoomOutButton" class="button-style">Zoom Out (-)</button>
                        <button id="rotateLeftButton" class="button-style">Rotate L</button>
                        <button id="rotateRightButton" class="button-style">Rotate R</button>
                        <button id="deleteImageButton" class="button-style danger-button">Delete</button>
                        <button id="modifyImageButton" class="button-style" disabled>Modify (Caption)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Change Password Modal -->
    <div id="changePasswordModal" class="modal" style="display: none;">
        <div class="modal-content auth-section">
            <span id="closeChangePasswordModalButton" class="close-button">&times;</span>
            <h2>Change Password</h2>
            <form id="changePasswordForm">
                <div>
                    <label for="currentPassword">Current Password:</label>
                    <input type="password" id="currentPassword" name="currentPassword" required />
                </div>
                <div>
                    <label for="newPassword">New Password:</label>
                    <input type="password" id="newPassword" name="newPassword" required />
                </div>
                <div>
                    <label for="confirmNewPassword">Confirm New Password:</label>
                    <input type="password" id="confirmNewPassword" name="confirmNewPassword" required />
                </div>
                <button type="submit" id="updatePasswordButton" class="button-style">Update Password</button>
                <p class="message-area" id="changePasswordMessage"></p>
            </form>
        </div>
    </div>

</body>
</html>
